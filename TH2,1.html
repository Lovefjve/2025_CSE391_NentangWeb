<html lang="en"><head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&amp;family=Oleo+Script:wght@700&amp;family=Quicksand:wght@300;500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="styles.css">
    <title>Travel Goals</title>
	<style>
	header {
		display: flex;
		justify-content: space-between;
		align-items: center;
		background-image: url("images/places/ocean.jpg");
	}
	nav ul {
		list-style-type: none;
		align-items: center;
	}
	nav li {
		float: left;
	}

	li a {
		text-align: center;
		padding-right: 16px;
		text-decoration: none;
		
	}
	a:link {
		text-decoration: none;
		color: yellow;
	}

	a:visited {
		text-decoration: none;
		color: yellow;
	}
	#hero {
		background-image: url("images/places/ocean.jpg");
		background-repeat: no-repeat;
		background-position: center center;
		background-size: cover;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content:center;
		height: 400px;
	}
	
	#hero-content{
		background-color: gray;
		opacity: 80%;
		text-align:center;
		padding: 20px;
	}
	#hero-content a {
		background-color: yellow;
		padding: 10px;
		border-radius: 25px;
		color: black;
	}
	#highlights{
		text-align: center;
		background-color: aqua;
	}
	#destinations {
		display: flex;
		justify-content: center;
		justify-content: space-around;
		align-items: center;
		list-style-type: none;
	}
	
	img{
		width: 100%;
		height: 200px;
	}
	
	footer {
		background-color: black;
	}
	
	footer ul {
		list-style-type: none;
		display:	flex;
		align-items: center;
		justify-content: center;
	}
	.icon{
		width: 100%;
		height: 30px;
	}
	
	ul,h2 {
		margin: 0px;
		padding: 5px;
	}
	</style>
  </head>
  <body>
    <header>
      <div id="page-logo">
        <a href="/index.html">Travel Goals</a>
      </div>
      <nav>
        <ul>
          <li><a href="/places.html">Destinations</a></li>
          <li><a href="">About</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="hero">
        <div id="hero-content">
          <h1>Joe's Travel Page</h1>
          <p>Let's explore the world together!</p>
          <a href="/places.html">Discover places</a>
        </div>
      </section>
      <section id="highlights">
        <h2>Highlights</h2>
        <ul id="destinations">
          <li class="destination">
            <img src="images/places/miami.jpg" alt="Miami streets on sunny day">
            <p>Miami <strong>USA</strong></p>
          </li>
          <li class="destination">
            <img src="images/places/munich.jpg" alt="Munich stadium in winter">
            <p>Munich <strong>Germany</strong></p>
          </li>
          <li class="destination">
            <img src="images/places/barcelona.jpg" alt="Palm beach in Barcelona">
            <p>Barcelona <strong>Spain</strong></p>
          </li>
        </ul>
      </section>
    </main>
    <footer>
      <ul>
        <li>
          <a href="https://www.instagram.com">
            <img class="icon" src="images/icons/insta.png" alt="Instagram logo"></a>
        </li>
        <li>
          <a href="https://www.facebook.com">
            <img class="icon" src="images/icons/facebook.png" alt="Facebook logo"></a>
        </li>
      </ul>
    </footer>
  

</body></html>
